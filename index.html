<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Stream — Flapping Overlay</title>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, logoBadge;
        let clock = new THREE.Clock();
        
        // Palitan mo ito ng sarili mong image link
        const logoUrl = 'https://i.postimg.cc/q7phbDXB/Code-Generated-Image-(7).png';

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 7.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0); // Transparent background
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const frontLight = new THREE.DirectionalLight(0xffffff, 1.0);
            frontLight.position.set(0, 2, 5);
            scene.add(frontLight);

            // Load logo
            loadLogoTexture(logoUrl);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function loadLogoTexture(url) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous';

            textureLoader.load(
                url,
                function(texture) {
                    texture.generateMipmaps = true;
                    texture.minFilter = THREE.LinearMipmapLinearFilter;
                    createBadge(texture);
                },
                undefined,
                function(error) {
                    console.error('Error loading texture:', error);
                    alert('Hindi ma-load ang image. Check mo ang link!');
                }
            );
        }

        function createBadge(texture) {
            const radius = 2.2;
            const thickness = 0.01; // Mas manipis para parang flat na logo
            const segments = 64;

            const geometry = new THREE.CylinderGeometry(radius, radius, thickness, segments);

            // Invisible/transparent na ang gilid
            const edgeMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide
            });

            const frontMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0,
                side: THREE.FrontSide
            });

            const backMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 1.0,
                side: THREE.BackSide
            });

            const materials = [
                edgeMaterial,   // Gilid — invisible
                frontMaterial,  // Harap
                backMaterial    // Likod
            ];

            logoBadge = new THREE.Mesh(geometry, materials);
            logoBadge.rotation.x = Math.PI / 2; // I-flat nang patayo
            scene.add(logoBadge);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (logoBadge) {
                let elapsedTime = clock.getElapsedTime();

                // ✅ Mas natural na pag-flap — parang umiindayog na bandera
                let baseAngle = Math.PI / 2; // Nakatayo nang patayo
                let flapSpeed = 1.8;        // Bilis ng pag-flap — pwede mong baguhin
                let flapAmount = 0.25;      // Lawak ng pag-flap — pwede mong baguhin

                // Main flap motion
                logoBadge.rotation.x = baseAngle + Math.sin(elapsedTime * flapSpeed) * flapAmount;

                // Tuwing 10 segundo — mas malalim na pag-flap para makita ang likod
                let deepCycle = elapsedTime % 10;
                if (deepCycle < 1.5) {
                    let deepProgress = deepCycle / 1.5;
                    let deepFlap = Math.sin(deepProgress * Math.PI) * 0.8;
                    logoBadge.rotation.x = baseAngle + Math.sin(elapsedTime * flapSpeed) * flapAmount + deepFlap;
                }
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
